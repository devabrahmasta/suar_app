name: Sync OpenQuake Microservice to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'openquake-microservice/**'
      - '.github/workflows/deploy-openquake-microservice-hf.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required

      - name: Push OpenQuake Microservice Subdirectory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git credentials
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Create a fresh clean git repository snapshot for openquake-microservice
          cd openquake-microservice
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy latest openquake-microservice snapshot to Hugging Face Spaces"

          # Force push clean HEAD snapshot to Hugging Face Spaces main branch
          git push -f https://lintangnv:$HF_TOKEN@huggingface.co/spaces/lintangnv/suar-openquake HEAD:refs/heads/main
